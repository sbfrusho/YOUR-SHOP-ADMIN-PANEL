name: your_shop_admin
description: Admin panel for the Your Shop store.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  cached_network_image: ^4.0.7
  cloud_firestore: ^7.2.0
  connectivity_plus: ^7.3.2
  firebase_auth: ^7.1.0
  firebase_core: ^5.2.0
  firebase_storage: ^14.1.0
  get: ^4.6.6
  http: ^1.2.1
  image_picker: ^1.2.4
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_cloud_firestore: ^4.5.0
  firebase_auth_mocks: ^0.16.0
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlayfairDisplay-Bold.ttf
          weight: 700

# Launcher icons: `dart run flutter_launcher_icons` (images from
# tool/generate_brand_assets_test.dart).
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#22201E"
  adaptive_icon_foreground: assets/branding/app_icon_foreground.png
  adaptive_icon_monochrome: assets/branding/app_icon_monochrome.png
  remove_alpha_ios: true
  min_sdk_android: 24

# Native splash: `dart run flutter_native_splash:create`. Charcoal in both
# themes, matching the launcher icon. The web build has its own (index.html).
flutter_native_splash:
  color: "#22201E"
  image: assets/branding/splash_logo.png
  android_12:
    color: "#22201E"
    image: assets/branding/splash_android12.png
    icon_background_color: "#22201E"
  web: false
